# Demo profile — local development and reviewer builds only.
#
# Run with:  SPRING_PROFILES_ACTIVE=demo ./gradlew :guardian-api:bootRun
#
# Everything here exists so a developer can open the parent app against a real backend
# without hand-building a tenant first. None of it is reachable in a deployment that does
# not name this profile explicitly, which is the point: the seed and the fixed OTP are both
# things that must never reach production, so they are gated structurally rather than by a
# flag someone remembers to turn off.

spring:
  flyway:
    # `db/seed` is additive. The production path stays exactly `classpath:db/migration`, so
    # the demo data is absent from any build that does not activate this profile.
    locations: classpath:db/migration,classpath:db/seed

guardian:
  auth:
    # Matches TestAccount in flutter/parent_app: phone 8050602046, code 123123. A reviewer
    # or a simulator cannot receive an SMS, and without this every local sign-in needs a live
    # handset. It is read from configuration rather than compiled in precisely so it cannot
    # exist outside this profile.
    magic-otp: ${GUARDIAN_MAGIC_OTP:123123}

    # The seeded demo accounts (V900, V901) — the only addresses for which the fixed code above
    # is accepted on the email sign-in path. Any address NOT listed here gets a freshly generated
    # code, delivered by whichever AccountEmailSender is active: logged by default, actually
    # emailed once guardian.mail.enabled=true. That is what lets a real address be exercised
    # end-to-end on this profile without giving every account a guessable code.
    magic-otp-emails: >-
      ${GUARDIAN_MAGIC_OTP_EMAILS:superadmin@guardian-platform.example,
      priya@guardian-platform.example,
      orgadmin@demo-trust.example,
      schooladmin@demo-trust.example,
      principal@demo-trust.example,
      transportmanager@demo-trust.example,
      anil@demo-trust.example}

logging:
  level:
    # The demo OTP sender writes the code it would have sent; at INFO it is invisible.
    com.guardian.identity.infrastructure.otp: DEBUG
