spring:
  application:
    name: guardian-api

  datasource:
    url: ${GUARDIAN_DB_URL:jdbc:postgresql://localhost:5432/guardian}
    # The runtime role: NOT the table owner, and without BYPASSRLS. Running as the owner
    # would silently defeat row-level security (docs/03-database/RLS_POLICIES.md).
    username: ${GUARDIAN_DB_USERNAME:guardian_app}
    password: ${GUARDIAN_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${GUARDIAN_DB_POOL_SIZE:20}
      # Tenant context is set with SET LOCAL, so it expires with each transaction and
      # cannot leak to the next borrower of a pooled connection.
      auto-commit: false

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway, never by Hibernate. `validate` catches drift between
      # the entity mappings and the migrations at startup rather than at runtime.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    # Migrations run as the owner; the application runs as guardian_app.
    #
    # `url` is repeated here rather than inherited. With only user/password set, Spring Boot
    # derives Flyway's DataSource from the application's — and the application's is wrapped by
    # TenantAwareDataSource, which Boot cannot read a JDBC URL back out of. Startup then fails
    # with "Unable to find suitable method for url", which names neither Flyway's derivation nor
    # the wrapper. Configuring Flyway completely removes the derivation entirely.
    url: ${GUARDIAN_DB_URL:jdbc:postgresql://localhost:5432/guardian}
    user: ${GUARDIAN_DB_MIGRATION_USERNAME:guardian_owner}
    password: ${GUARDIAN_DB_MIGRATION_PASSWORD:}
    locations: classpath:db/migration
    baseline-on-migrate: false
    # V900__demo_data.sql (db/seed, demo profile only) is deliberately numbered high so it
    # always runs last against a freshly-seeded local database. Without this, any real
    # migration added afterward with a lower version (e.g. V13) is rejected by Flyway's
    # default in-order check once V900 has already been applied.
    out-of-order: true

  servlet:
    multipart:
      # Bulk student import (STU-002) is the only multipart surface. A 5,000-row CSV — the
      # synchronous ceiling — is well under a megabyte; these bounds leave headroom for wide
      # files without letting an upload hold a request thread on megabytes of body.
      max-file-size: 5MB
      max-request-size: 6MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    # SMTP for the account-lifecycle emails — invitation, reset code, password-changed notice
    # (ADR-0014). `host` is deliberately absent here: while spring.mail.host is unset,
    # SmtpAccountEmailSender is not registered — development falls back to the logging adapter,
    # and prod/production (where the logging adapter is excluded by profile) fails to start
    # rather than silently not sending. Set the host to turn on real delivery, e.g. for a
    # Google Workspace / Gmail account:
    #   SPRING_MAIL_HOST=smtp.gmail.com
    #   GUARDIAN_SMTP_USERNAME=no-reply@yourschooldomain.com
    #   GUARDIAN_SMTP_PASSWORD=<16-char app password>   (not the account password)
    port: ${GUARDIAN_SMTP_PORT:587}
    username: ${GUARDIAN_SMTP_USERNAME:}
    password: ${GUARDIAN_SMTP_PASSWORD:}
    properties:
      # Authentication turns itself on when a username/password is supplied, so it is not forced
      # here — a local catcher (MailHog) with no credentials still works. STARTTLS is offered,
      # not required, so port 587 (Gmail) upgrades and a plain local sink does not.
      mail.smtp.starttls.enable: true
      # A slow or unreachable SMTP host must fail fast — the send runs after the request's
      # transaction has committed, so a hang here holds a response, not data.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${GUARDIAN_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

guardian:
  auth:
    magic-otp: ${GUARDIAN_MAGIC_OTP:}

  email:
    # The From address on account-lifecycle email (ADR-0014). Platform-wide for now — per-tenant
    # sender identity is ADR-0005's EmailChannel. Note: some providers (Gmail included) rewrite
    # From to the authenticated mailbox unless this is a verified alias of it.
    from: ${GUARDIAN_EMAIL_FROM:Guardian Platform <no-reply@localhost>}

  web:
    # Origins permitted to call this API from a browser — the admin console (ADR-0003) only;
    # the mobile apps are not subject to the same-origin policy.
    #
    # Defaults to the local development origin. `flutter run -d chrome` picks a fresh port each
    # launch, hence the port wildcard; the scheme and host are still pinned to loopback, which no
    # remote attacker can serve from. A deployment sets this to the console's real origin —
    # comma-separated, e.g. https://admin.guardianplatform.io — and gets nothing by default.
    # Quoted: the value contains `[` and `]`, which YAML would otherwise be entitled to read
    # as flow-sequence syntax depending on the parser.
    allowed-origins: "${GUARDIAN_ALLOWED_ORIGINS:http://localhost:[*]}"

logging:
  level:
    root: INFO
    com.guardian: ${GUARDIAN_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
