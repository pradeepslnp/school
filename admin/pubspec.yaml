name: guardian_admin
description: "Guardian Platform — school and platform administration console (ADR-0003)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # guardian_core removed for local dev; re-add as a package or path when available

  # Shared color theme (colors only — see guardian-theme/README.md). Local path dependency:
  # this repo and guardian-theme are expected to sit as siblings under the same parent
  # folder. Change a color in guardian-theme and it's picked up here on the next rebuild.
  guardian_theme:
    path: ../flutter/shared_packages/guardian_theme
  # guardian_theme:
  # git:
  #   url: https://github.com/your-org/guardian-theme.git
  #   ref: v0.1.0   # a tag or commit SHA, not "main"

  # Presentation state. UI emits events, BLoC emits states; no decisions in widgets
  # (ENGINEERING_PRINCIPLES.md §8). Same versions as the driver and parent apps, so the
  # three clients stay mergeable when guardian_core returns.
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # HTTP transport. Used only by core/network/RestClient — data providers call RestClient,
  # never package:http directly (PROJECT_STRUCTURE.md §core/network).
  http: ^1.5.0

  # Deliberately absent: a routing package.
  #
  # The console's routing is derived from one input — the session — plus a location string,
  # and Navigator 2.0 expresses that directly in app/console_router.dart. A router package
  # would add a dependency and, worse, a second place for redirect rules to live: the rule
  # that a revoked session cannot keep a screen holding child data mounted must have exactly
  # one implementation (BR-IAM-007). Revisit if nested routing or route-level guards arrive,
  # and record it as an ADR if so.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
