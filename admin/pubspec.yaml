name: guardian_admin
description: "Guardian Platform — school and platform administration console (ADR-0003)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # guardian_core removed for local dev; re-add as a package or path when available

  # Shared color theme (colors only — see guardian-theme/README.md). Local path dependency:
  # this repo and guardian-theme are expected to sit as siblings under the same parent
  # folder. Change a color in guardian-theme and it's picked up here on the next rebuild.
  guardian_theme:
    path: ../flutter/shared_packages/guardian_theme
  # guardian_theme:
  # git:
  #   url: https://github.com/your-org/guardian-theme.git
  #   ref: v0.1.0   # a tag or commit SHA, not "main"

  # Presentation state. UI emits events, BLoC emits states; no decisions in widgets
  # (ENGINEERING_PRINCIPLES.md §8). Same versions as the driver and parent apps, so the
  # three clients stay mergeable when guardian_core returns.
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # HTTP transport. Used only by core/network/RestClient — data providers call RestClient,
  # never package:http directly (PROJECT_STRUCTURE.md §core/network).
  http: ^1.5.0

  # Browser APIs for the one thing a Flutter Web build cannot do without them: let the
  # operator choose a spreadsheet to upload, and hand back a corrected error file to save
  # (bulk student import, STU-002 / screen A-12). First-party, and the modern replacement for
  # dart:html — kept behind `features/students/import/data_provider` so nothing else in the
  # console touches a browser type. ADR-0003 already fixes this client to the web.
  web: ^1.1.0

  # Localisation (ADR-0013 — interim client-bundled English/Kannada, ahead of the
  # backend-driven CFG-006 design in ADR-0007). `intl` backs the generated
  # `AppLocalizations`; `flutter_localizations` supplies the framework's own delegates
  # (Material/Cupertino/Widgets) for the locales this console supports.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Persists the operator's chosen console language across sessions (ADR-0013 §5) — the
  # same role `shared_preferences` plays in the other two apps' `ThemeController` precedent.
  # Not routed through `RestClient`: this is a local-only UI preference, never sent to or
  # read from the API.
  shared_preferences: ^2.5.5

  # Deliberately absent: a routing package.
  #
  # The console's routing is derived from one input — the session — plus a location string,
  # and Navigator 2.0 expresses that directly in app/console_router.dart. A router package
  # would add a dependency and, worse, a second place for redirect rules to live: the rule
  # that a revoked session cannot keep a screen holding child data mounted must have exactly
  # one implementation (BR-IAM-007). Revisit if nested routing or route-level guards arrive,
  # and record it as an ADR if so.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Bundled rather than loaded from fonts.googleapis.com at runtime. A web console that
  # fetches its typeface from a third party renders in a fallback face whenever that host is
  # slow, blocked by a school network, or unreachable — and the console is the surface an
  # operator opens during an incident. Bundling also keeps the build reproducible.
  #
  # Barlow carries the UI (its slightly squared, signage-derived shapes suit a transport
  # tool); Archivo sets headings and the numerals on the operations counts, where the extra
  # width reads at a glance. Both ship only the weights actually used.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
